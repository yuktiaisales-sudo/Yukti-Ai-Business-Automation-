<!DOCTYPE html>
<html>

<head>

    <title>Yukti-AI CRM Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-container">

    <img src="{{ url_for('static',
    filename='images/logo.png') }}"
    class="logo">

    <h1>Yukti-AI CRM</h1>

    <p>Business Automation Platform</p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button>

            Login

        </button>

    </form>

</div>

</body>

</html>
